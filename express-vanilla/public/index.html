<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --text: #1c1e21; --muted: #6b7280;
      --border: #d7dbe0; --accent: #2f5bea; --accent-hover: #2449c4;
      --error-bg: #fdecec; --error: #b42318; --ok-bg: #e8f6ee; --ok: #1a7f45;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111316; --card: #1b1e23; --text: #e8eaed; --muted: #9aa0a6;
        --border: #33373d; --accent: #5b82ff; --accent-hover: #7897ff;
        --error-bg: #3a1a1a; --error: #ff8a80; --ok-bg: #16301f; --ok: #6fd69a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: .92rem; }
    label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: transparent; color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%; margin-top: 20px; padding: 11px; font-size: 1rem; font-weight: 600;
      border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    .msg { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: .9rem; }
    .msg.error { display: block; background: var(--error-bg); color: var(--error); }
    .msg.ok { display: block; background: var(--ok-bg); color: var(--ok); }
    .switch { margin-top: 18px; text-align: center; font-size: .9rem; color: var(--muted); }
    .switch a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Signed-in view -->
    <section id="welcome" class="hidden">
      <h1>Welcome, <span id="who"></span></h1>
      <p class="sub" id="whoEmail"></p>
      <button id="logoutBtn">Log out</button>
    </section>

    <!-- Login / register form -->
    <section id="authView">
      <h1 id="title">Sign in</h1>
      <p class="sub" id="subtitle">Use your email and password.</p>
      <form id="authForm" novalidate>
        <div id="nameField" class="hidden">
          <label for="name">Full name</label>
          <input id="name" name="name" autocomplete="name" />
        </div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />
        <button type="submit" id="submitBtn">Sign in</button>
        <div id="msg" class="msg" role="alert"></div>
      </form>
      <p class="switch"><span id="switchText">No account?</span> <a id="switchLink">Create one</a></p>
    </section>
  </main>

  <script>
    let mode = 'login';
    const $ = (id) => document.getElementById(id);

    function showMsg(text, type = 'error') {
      $('msg').textContent = text;
      $('msg').className = 'msg ' + type;
    }
    function clearMsg() { $('msg').className = 'msg'; }

    function setMode(m) {
      mode = m;
      const reg = m === 'register';
      $('title').textContent = reg ? 'Create account' : 'Sign in';
      $('subtitle').textContent = reg ? 'It only takes a minute.' : 'Use your email and password.';
      $('submitBtn').textContent = reg ? 'Create account' : 'Sign in';
      $('nameField').classList.toggle('hidden', !reg);
      $('password').autocomplete = reg ? 'new-password' : 'current-password';
      $('switchText').textContent = reg ? 'Already have an account?' : 'No account?';
      $('switchLink').textContent = reg ? 'Sign in' : 'Create one';
      clearMsg();
    }

    function showUser(user) {
      $('who').textContent = user.name;
      $('whoEmail').textContent = user.email;
      $('authView').classList.add('hidden');
      $('welcome').classList.remove('hidden');
    }

    $('switchLink').onclick = () => setMode(mode === 'login' ? 'register' : 'login');

    $('authForm').onsubmit = async (e) => {
      e.preventDefault();
      clearMsg();
      const body = { email: $('email').value.trim(), password: $('password').value };
      if (mode === 'register') body.name = $('name').value.trim();

      $('submitBtn').disabled = true;
      try {
        const res = await fetch(mode === 'login' ? '/api/login' : '/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) return showMsg(data.error || 'Something went wrong.');
        $('authForm').reset();
        showUser(data.user);
      } catch {
        showMsg('Could not reach the server.');
      } finally {
        $('submitBtn').disabled = false;
      }
    };

    $('logoutBtn').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      $('welcome').classList.add('hidden');
      $('authView').classList.remove('hidden');
      setMode('login');
    };

    // If already logged in (session cookie), skip the form
    fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((d) => d && showUser(d.user));
  </script>
</body>
</html>
